name: Karate tests by tag

on:
  workflow_dispatch:
    inputs:
      karate_tag:
        description: "Agrega el tageo que deseas ejecutar"
        required: true
      karate_env:
        description: "Ambiente de ejecución (dev, cert, prod)"
        required: true
        default: "dev"

jobs:
  karate:
    name: Run Karate tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run selected Karate tag
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn clean test -Dkarate.env=${{ inputs.karate_env }} "-Dkarate.options=--tags ${{ inputs.karate_tag }}"

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports
          if-no-files-found: ignore
